name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CI dependencies (core + desktop)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -r requirements-desktop.txt

      - name: Syntax-check every Python file
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py -File . |
            Where-Object { $_.FullName -notmatch '\\.venv' }
          $errs = 0
          foreach ($f in $files) {
            python -m py_compile $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $($f.FullName)"; $errs++ }
          }
          if ($errs -gt 0) { exit 1 }
          Write-Host "compiled $($files.Count) files"

      - name: Syntax-check frontend
        run: node --check static/js/app.js

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Confirm the windowless launch works (pythonw)
        shell: pwsh
        run: |
          # The app ships as pythonw.exe with no console. This starts the
          # real pythonw, takes mcp.runtime._errlog() and completes an MCP
          # handshake inside it - the check 1.33.4 lacked (DECISIONS #14).
          $env:PYTHONIOENCODING = "utf-8"
          python -m unittest tests.test_pythonw_smoke -v
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run test suite (with coverage)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          coverage run -m unittest discover -s tests
          coverage report -m
