name: Installer

# Builds the Windows installer on every release tag and verifies it by
# actually installing it. The tag is what a user downloads, so the
# packaging path gets the same gate as the test suite.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The bootstrap finds Python by probing the runner image, and the
      # image's default interpreter moves without notice. CI tests 3.10;
      # the installer has to bootstrap the interpreter it is tested with,
      # or this gate fails for reasons that have nothing to do with the
      # installer. Pin it, exactly as ci.yml does.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Report the artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $info = $exe.VersionInfo
          Write-Host "artifact : $($exe.Name)"
          Write-Host "size     : $([math]::Round($exe.Length / 1MB, 1)) MB"
          Write-Host "version  : $($info.FileVersion)"
          Write-Host "product  : $($info.ProductName)"

      # The point of this step: a packaging mistake that leaks .env or
      # bundles the local speech models cannot be caught by reading the
      # script, only by installing it and looking.
      - name: Verify the installer (silent install, then assert)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'jarvis-install-test'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }

          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', `
            '/MERGETASKS=!deps,!playwright', "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

          $bad = @()
          foreach ($rel in @('.env', '.env.bak', 'logs', 'mcp_servers.json',
                             'jarvis_config.json', 'docs\research',
                             'library\user_catalog.json', 'modules\state.json')) {
            if (Test-Path -LiteralPath (Join-Path $dir $rel)) { $bad += $rel }
          }
          if (Get-ChildItem $dir -Recurse -Filter *.onnx -ErrorAction SilentlyContinue) {
            $bad += 'speech models (*.onnx)'
          }
          if (Get-ChildItem $dir -Recurse -Filter *.db -ErrorAction SilentlyContinue) {
            $bad += 'memory database (*.db)'
          }
          foreach ($rel in @('config.py', 'run.py', 'desktop.py', '.env.example',
                             'static\js\app.js', 'templates\index.html',
                             'installer\install-deps.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $rel))) {
              $bad += "MISSING $rel"
            }
          }
          if ($bad.Count -gt 0) {
            throw "installer verification failed: $($bad -join ', ')"
          }
          Write-Host 'verified: no secrets, no local models, no database, app files present'

          Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if (Test-Path $dir) { throw 'uninstaller left the install directory behind' }
          Write-Host 'verified: uninstall removes everything'

      # The installer's promise is "it builds the environment for you", and
      # that path is invisible to any file-content assertion. The first
      # shipped build failed here: Windows PowerShell 5.1 rejects
      # `Tee-Object -LiteralPath ... -Append`, so setup died the moment it
      # tried to create the virtualenv. Run the bootstrap for real.
      - name: Verify the dependency bootstrap
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'jarvis-deps-test'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }

          Start-Process -FilePath $exe -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', `
            '/MERGETASKS=!deps,!playwright', "/DIR=$dir"

          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File (Join-Path $dir 'installer\install-deps.ps1') `
            -AppDir $dir -SkipPlaywright
          if ($LASTEXITCODE -ne 0) {
            # install-deps tees every step and all of pip's output into
            # logs\install.log. Without this, a failure here is a bare
            # exit code and the real reason dies with the runner.
            $log = Join-Path $dir 'logs\install.log'
            if (Test-Path -LiteralPath $log) {
              Write-Host '--- install-deps.ps1 log (tail) ---'
              Get-Content -LiteralPath $log -Tail 120
              Write-Host '--- end of log ---'
            } else {
              Write-Host "no install log was written at $log"
            }
            throw "install-deps.ps1 exited $LASTEXITCODE"
          }

          foreach ($rel in @('.venv\Scripts\python.exe', '.env')) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $rel))) {
              throw "the dependency bootstrap did not create $rel"
            }
          }
          & (Join-Path $dir '.venv\Scripts\python.exe') -c 'import flask, config; print(config.VERSION)'
          if ($LASTEXITCODE -ne 0) { throw 'the built environment cannot import the app' }
          Write-Host 'verified: the installer builds a working environment'

          Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if (Test-Path $dir) { throw 'uninstaller left the install directory behind' }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
